name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "866176997550"
      AWS_REGION: ap-southeast-2
      STACK_NAME: my-app-stack
      SERVICE_NAME: api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=prod \
              ECRBaseUrl="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
              DesiredCount=0

      - name: Build and deploy frontend
        run: |
          # Install dependencies and build static assets
          cd frontend
          npm ci
          npm run build
          cd ..

          # Fetch infrastructure outputs
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text \
            --region "${AWS_REGION}")

          CF_DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text \
            --region "${AWS_REGION}")

          # Sync static assets to S3
          aws s3 sync frontend/out/ "s3://${FRONTEND_BUCKET}" \
            --delete \
            --region "${AWS_REGION}"

          # Invalidate CloudFront cache
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deploy ECS services
        run: |
          ECR_BASE_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPOSITORY="${STACK_NAME}-${SERVICE_NAME}"
          # Use the full git SHA as an immutable, unique tag per build
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_NAME="${ECR_BASE_URL}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          ECS_CLUSTER="${STACK_NAME}-cluster"
          ECS_SERVICE="${STACK_NAME}-${SERVICE_NAME}"
          TASK_DEF_FAMILY="${STACK_NAME}-${SERVICE_NAME}"

          # Build and push container image tagged with the immutable git SHA
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_BASE_URL}"
          docker build -t "${IMAGE_NAME}" .
          docker push "${IMAGE_NAME}"

          # Resolve the immutable digest from ECR so rollbacks land on the exact image
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${AWS_REGION}")
          IMAGE_WITH_DIGEST="${ECR_BASE_URL}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          # Fetch the current task definition and produce a new revision pinned to the digest
          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_FAMILY}" \
            --query 'taskDefinition' \
            --output json \
            --region "${AWS_REGION}")

          NEW_TASK_DEF=$(echo "${TASK_DEF_JSON}" | jq \
            --arg image "${IMAGE_WITH_DIGEST}" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)')

          TASK_DEF_ARN=$(echo "${NEW_TASK_DEF}" \
            | aws ecs register-task-definition \
                --cli-input-json file:///dev/stdin \
                --query 'taskDefinition.taskDefinitionArn' \
                --output text \
                --region "${AWS_REGION}")

          # Update the ECS service to the specific, digest-pinned task definition revision
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEF_ARN}" \
            --region "${AWS_REGION}"
